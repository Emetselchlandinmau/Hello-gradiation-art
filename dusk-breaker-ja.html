<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>夕暮れのブロックブレーク</title>
<style>
:root{--bg:#e9e6f2;--ink:#242347;--dim:#6b6a8c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12122b;--ink:#ecebff;--dim:#8f8eb5}}
:root[data-theme="dark"]{--bg:#12122b;--ink:#ecebff;--dim:#8f8eb5}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;padding:.5rem;user-select:none}
#hud{display:flex;justify-content:space-between;width:min(100%,360px,calc((100vh - 5rem)*2/3));font-size:.95rem}
#hud b{font-size:1.1rem}
canvas{touch-action:none;background:#1e2140;border-radius:10px;width:min(100%,360px,calc((100vh - 5rem)*2/3));aspect-ratio:2/3;display:block}
button{font:inherit;font-size:.8rem;background:transparent;color:var(--dim);border:1px solid var(--dim);border-radius:999px;padding:.2rem .9rem;cursor:pointer}
#ctl{display:flex;align-items:center;gap:.9rem;font-size:.8rem;color:var(--dim)}
#vl{width:7.5rem;vertical-align:middle;accent-color:#ffd43b}
p{margin:0;color:var(--dim);font-size:.8rem}
</style>
</head>
<body>
<div id="hud"><span>スコア <b id="sc">0</b></span><span>ステージ <b id="lv">1</b></span><span>ライフ <b id="li">3</b></span><span>ベスト <b id="hi">0</b></span></div>
<canvas id="c" width="360" height="540"></canvas>
<div id="ctl"><button id="bt" type="button">おんがく ON</button><label>音量 <input id="vl" type="range" min="0" max="100" value="70"></label></div>
<p>動かす:マウス・指　発射:タップ　キー:← → スペース</p>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=360,H=540;
const COL=['#ff7a6b','#ffa94d','#ffd43b','#69db7c','#4dabf7','#9775fa'];
let hi=0;try{hi=+localStorage.getItem('dusk-hi')||0}catch(e){}
let st,P,B,bricks;
const rr=(x,y,w,h,r)=>{g.roundRect?g.roundRect(x,y,w,h,r):g.rect(x,y,w,h)};
const $=id=>document.getElementById(id);
function build(){bricks=[];for(let r=0;r<6;r++)for(let c=0;c<8;c++)bricks.push({x:6+c*44,y:60+r*22,w:40,h:18,col:COL[r],pts:(6-r)*10})}
function reset(){st={score:0,lv:1,lives:3,run:false,over:false,speed:4.2};P={x:W/2,w:72,h:10,y:H-30};build();park()}
function park(){B={x:P.x,y:P.y-8,vx:0,vy:0,r:6};st.run=false}
function launch(){await audio();if(st.over){reset();return}if(!st.run){const a=(Math.random()*.6-.3);B.vx=st.speed*Math.sin(a);B.vy=-st.speed*Math.cos(a);st.run=true}}
function hud(){$('sc').textContent=st.score;$('lv').textContent=st.lv;$('li').textContent=st.lives;$('hi').textContent=hi}
function save(){if(st.score>hi){hi=st.score;try{localStorage.setItem('dusk-hi',hi)}catch(e){}}}
function step(){
 if(st.run&&!st.over){
  B.x+=B.vx;B.y+=B.vy;
  if(B.x<B.r){B.x=B.r;B.vx*=-1}if(B.x>W-B.r){B.x=W-B.r;B.vx*=-1}if(B.y<B.r){B.y=B.r;B.vy*=-1}
  if(B.vy>0&&B.y+B.r>=P.y&&B.y+B.r<=P.y+P.h+6&&B.x>P.x-P.w/2-B.r&&B.x<P.x+P.w/2+B.r){
   const k=(B.x-P.x)/(P.w/2),a=k*1.05,s=Math.hypot(B.vx,B.vy);B.vx=s*Math.sin(a);B.vy=-s*Math.cos(a);B.y=P.y-B.r}
  for(let i=0;i<bricks.length;i++){const b=bricks[i];
   if(B.x+B.r>b.x&&B.x-B.r<b.x+b.w&&B.y+B.r>b.y&&B.y-B.r<b.y+b.h){
    const ox=Math.min(B.x+B.r-b.x,b.x+b.w-(B.x-B.r)),oy=Math.min(B.y+B.r-b.y,b.y+b.h-(B.y-B.r));
    if(ox<oy)B.vx*=-1;else B.vy*=-1;
    st.score+=b.pts;ping(b.pts/10);bricks.splice(i,1);hud();break}}
  if(!bricks.length){st.lv++;st.speed=Math.min(st.speed+.6,8);build();park();hud()}
  if(B.y>H+B.r){st.lives--;if(st.lives<=0){st.over=true;save()}else park();hud()}
 }else if(!st.over){B.x=P.x;B.y=P.y-8}
}
function text(t,y,sz,c){g.fillStyle=c;g.font=`700 ${sz}px 'Hiragino Sans','Yu Gothic','Meiryo',sans-serif`;g.textAlign='center';g.fillText(t,W/2,y)}
function draw(){
 g.clearRect(0,0,W,H);
 bricks.forEach(b=>{g.fillStyle=b.col;g.beginPath();rr(b.x,b.y,b.w,b.h,4);g.fill()});
 g.fillStyle='#ecebff';g.beginPath();rr(P.x-P.w/2,P.y,P.w,P.h,5);g.fill();
 g.beginPath();g.arc(B.x,B.y,B.r,0,7);g.fill();
 if(st.over){g.fillStyle='rgba(18,18,43,.78)';g.fillRect(0,0,W,H);text('ゲームオーバー',240,32,'#ecebff');text(`スコア ${st.score}`,280,20,'#ffd43b');text('もういちど:タップ',320,15,'#8f8eb5')}
 else if(!st.run)text(st.lv>1?`ステージ ${st.lv}  タップでスタート`:'タップでスタート',H/2+60,16,'#8f8eb5');
}
function loop(){step();draw();requestAnimationFrame(loop)}
function setX(cx){const r=cv.getBoundingClientRect();P.x=Math.max(P.w/2,Math.min(W-P.w/2,(cx-r.left)/r.width*W))}
addEventListener('pointermove',e=>setX(e.clientX));
cv.addEventListener('pointerdown',async e=>{setX(e.clientX);await launch()});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')P.x=Math.max(P.w/2,P.x-24);if(e.key==='ArrowRight')P.x=Math.min(W-P.w/2,P.x+24);if(e.key===' '){e.preventDefault();launch()}});
let AC,master,bus,dly,vol=.7,G=()=>vol*vol*1.1,on=true,nt=0,sp=0;
const SD=60/66/4;
const CH=[[174.61,220,261.63,329.63],[164.81,196,246.94,293.66],[146.83,174.61,220,261.63],[130.81,164.81,196,246.94]];
const BS=[87.31,82.41,73.42,65.41],PN=[523.25,587.33,659.25,783.99,880,1046.5];
function tone(f,t,d,v,type,a,s,dt){const o=AC.createOscillator(),e=AC.createGain();o.type=type;o.frequency.value=f;if(dt)o.detune.value=dt;e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(v,t+a);e.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(e);e.connect(bus);if(s)e.connect(dly);o.start(t);o.stop(t+d+.1)}
function kick(t){const o=AC.createOscillator(),e=AC.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);e.gain.setValueAtTime(.14,t);e.gain.exponentialRampToValueAtTime(.0001,t+.28);o.connect(e);e.connect(bus);o.start(t);o.stop(t+.3)}
function rhodes(f,t,d,v){tone(f,t,d,v,'sine',.01);tone(f*2,t,d*.4,v*.25,'triangle',.005)}
function stepAt(i,b,t){const c=CH[b];
 if(i===0){c.forEach((f,k)=>{rhodes(f,t+k*.025,3.6,.035);tone(f,t,SD*20,.026,'triangle',2.2,0,-6);tone(f,t,SD*20,.026,'triangle',2.2,0,6);tone(f*2,t,SD*20,.01,'sine',2.6,1,8)});
  tone(BS[b],t,2.4,.12,'sine',.08);if(b%2===0)kick(t);
  if(Math.random()<.9)tone(c[Math.floor(Math.random()*4)]*4,t+.6,7,.018,'sine',1.5,1)}
 if(i===10)c.slice(1).forEach((f,k)=>rhodes(f,t+k*.02,1.6,.022));
 if(i===8&&Math.random()<.5)tone(CH[(b+1)%4][Math.floor(Math.random()*4)]*4,t,6,.014,'sine',1.4,1);
 if([2,6,9,14].includes(i)&&Math.random()<.3)tone(c[Math.floor(Math.random()*4)]*2,t,2.6,.028,'sine',.02,1)}
function sched(){while(nt<AC.currentTime+.25){const i=sp%16,b=Math.floor(sp/16)%4;stepAt(i,b,nt+(i%2?SD*.2:0));nt+=SD;sp++}}
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();const r=AC.sampleRate;
 master=AC.createGain();master.gain.value=on?G():0;master.connect(AC.destination);
 bus=AC.createBiquadFilter();bus.type='lowpass';bus.frequency.value=2200;bus.connect(master);
 const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.04;lg.gain.value=700;lfo.connect(lg);lg.connect(bus.frequency);lfo.start();
 const im=AC.createBuffer(2,r*5,r);for(let ch=0;ch<2;ch++){const d=im.getChannelData(ch);for(let k=0;k<d.length;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/d.length,2.2)}
 const cv=AC.createConvolver();cv.buffer=im;const rg=AC.createGain();rg.gain.value=.8;bus.connect(rg);rg.connect(cv);cv.connect(master);
 dly=AC.createDelay(1.5);dly.delayTime.value=.68;const fb=AC.createGain();fb.gain.value=.45;dly.connect(fb);fb.connect(dly);dly.connect(bus);
 nt=AC.currentTime+.1;setInterval(sched,100)}catch(e){AC=null;return}}
 if(AC.state==='suspended')await AC.resume()}
function ping(r){if(!AC||!on)return;tone(PN[Math.min(r-1,5)],AC.currentTime,1.2,.04,'sine',.005,1)}
$('bt').onclick=e=>{on=!on;e.target.textContent='おんがく '+(on?'ON':'OFF');if(on)audio();if(master)master.gain.setTargetAtTime(on?G():0,AC.currentTime,.1);e.target.blur()};
$('vl').oninput=e=>{vol=e.target.value/100;if(vol>0&&!on){on=true;$('bt').textContent='おんがく ON'}if(master)master.gain.setTargetAtTime(on?G():0,AC.currentTime,.05)};
$('vl').onchange=e=>e.target.blur();
document.addEventListener('visibilitychange',()=>{if(AC){document.hidden?AC.suspend():(on&&AC.resume())}});
reset();hud();loop();
</script>
</body>
</html>
